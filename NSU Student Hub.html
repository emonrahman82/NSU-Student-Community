<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NSU Student Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#E4EAEF;--surface:#F6F8FA;--ink:#15292B;--muted:#55686B;--line:#CBD5DB;--stone:#A65F52;--stone-soft:#EBD3CC;--leaf:#2F6A47;--leaf-soft:#D3E6DA;
--display:'Bricolage Grotesque',system-ui,sans-serif;--body:'Figtree',system-ui,sans-serif;--ease:cubic-bezier(.2,.8,.2,1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1B1D;--surface:#172A2D;--ink:#E8EEF0;--muted:#97AAAD;--line:#2A4044;--stone:#D98B7B;--stone-soft:#3A2824;--leaf:#7CC49A;--leaf-soft:#1B3527}}
:root[data-theme="dark"]{--bg:#0F1B1D;--surface:#172A2D;--ink:#E8EEF0;--muted:#97AAAD;--line:#2A4044;--stone:#D98B7B;--stone-soft:#3A2824;--leaf:#7CC49A;--leaf-soft:#1B3527}
*{box-sizing:border-box;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--body);min-height:100vh}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--stone);outline-offset:3px;border-radius:8px}
header{view-transition-name:nav;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{max-width:1120px;margin:auto;padding:12px 24px;display:flex;align-items:center;gap:24px}
.brand{font:700 20px var(--display);letter-spacing:-.02em;white-space:nowrap}
nav{position:relative;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-left:auto}
nav a{position:relative;z-index:1;padding:8px 14px;border-radius:99px;font-weight:500;font-size:15px;color:var(--muted);white-space:nowrap;transition:color .3s}
nav a.on{color:var(--ink)}
#pill{position:absolute;top:0;left:0;height:100%;background:var(--surface);border:1px solid var(--line);border-radius:99px;transition:transform .5s var(--ease),width .5s var(--ease);z-index:0}
main{view-transition-name:page;max-width:1120px;margin:auto;padding:40px 24px 72px}
h1{font:700 clamp(36px,6vw,64px)/1.02 var(--display);letter-spacing:-.035em;max-width:14ch}
h2{font:700 28px/1.15 var(--display);letter-spacing:-.02em}
.lead{color:var(--muted);max-width:52ch;margin-top:16px;font-size:18px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center;padding:16px 0 48px}
.arch{border-radius:999px 999px 20px 20px;overflow:hidden;aspect-ratio:4/5;background:var(--stone-soft)}
.arch img{width:100%;height:100%;object-fit:cover;object-position:38% 50%;display:block}
.search{display:flex;gap:8px;margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 6px 6px 20px;max-width:520px;transition:box-shadow .3s}
.search:focus-within{box-shadow:0 0 0 3px var(--stone-soft)}
.search input{flex:1;border:0;background:none;font:inherit;color:var(--ink);min-width:0}
.search input:focus{outline:0}
.btn{border:0;background:var(--ink);color:var(--bg);font:600 15px var(--body);padding:10px 20px;border-radius:99px;cursor:pointer;transition:transform .25s var(--ease),opacity .2s}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.97)}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.notice{margin-top:24px;font-size:14px;color:var(--muted);max-width:52ch;padding-left:14px;border-left:3px solid var(--stone)}
.shortcuts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:48px}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;transition:transform .4s var(--ease),border-color .3s}
.sc:hover{transform:translateY(-4px);border-color:var(--stone)}
.sc b{font:700 18px var(--display);display:block}.sc span{color:var(--muted);font-size:14px}
.row{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;color:var(--muted);font:500 14px var(--body);padding:7px 14px;border-radius:99px;cursor:pointer;transition:all .3s var(--ease)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:6px;animation:pop .5s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}}
.card small{color:var(--muted)}.card h3{font:600 17px/1.3 var(--body)}
.tag{align-self:flex-start;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--stone-soft);color:var(--stone)}
.tag.ok{background:var(--leaf-soft);color:var(--leaf)}
.price{font:700 22px var(--display);margin-top:auto;padding-top:10px}
.table{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.tr{display:grid;grid-template-columns:1.4fr 1.2fr 1fr auto;gap:16px;padding:16px 20px;border-top:1px solid var(--line);align-items:center;animation:pop .5s var(--ease) both;animation-delay:calc(var(--i,0)*50ms)}
.tr:first-child{border-top:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:28px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.stat b{font:700 36px var(--display);display:block;letter-spacing:-.03em}
.empty{padding:40px;text-align:center;color:var(--muted);grid-column:1/-1}
footer{max-width:1120px;margin:auto;padding:0 24px 40px;color:var(--muted);font-size:13px}
::view-transition-old(page){animation:out .22s ease both}
::view-transition-new(page){animation:in .55s var(--ease) both}
@keyframes out{to{opacity:0;transform:translateY(-8px) scale(.995);filter:blur(3px)}}
@keyframes in{from{opacity:0;transform:translateY(22px);filter:blur(4px)}}
::view-transition-group(nav){animation:none}
@media (max-width:820px){.hero{grid-template-columns:1fr}.arch{aspect-ratio:16/10;border-radius:999px 999px 20px 20px/260px 260px 20px 20px;order:-1}.shortcuts{grid-template-columns:1fr 1fr}.tr{grid-template-columns:1fr auto}.tr>:nth-child(2),.tr>:nth-child(3){grid-column:1}.stats{grid-template-columns:1fr}.bar{flex-direction:column;align-items:stretch;gap:8px}nav{margin:0}}
.tg{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink);flex:none;transition:transform .4s var(--ease)}
.tg:hover{transform:rotate(18deg)}.tg:active{transform:scale(.92)}
.tg svg{position:absolute;inset:9px;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .7s var(--ease),opacity .4s}
.tg .moon{opacity:0;transform:rotate(-90deg) scale(.3)}
:root[data-theme="dark"] .tg .sun{opacity:0;transform:rotate(90deg) scale(.3)}
:root[data-theme="dark"] .tg .moon{opacity:1;transform:none}
.tswitch *{transition:background-color .6s,color .6s,border-color .6s!important}
.ico{width:32px;height:32px;stroke:var(--stone);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block;margin-bottom:14px}
.ico *{stroke-dasharray:90;stroke-dashoffset:90;animation:draw 1.3s var(--ease) .3s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.sc:hover .ico{animation:bob .7s var(--ease)}
@keyframes bob{30%{transform:translateY(-6px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
.gal{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px;margin-bottom:48px}
.gal figure{position:relative;overflow:hidden;border-radius:18px;aspect-ratio:4/3;background:var(--stone-soft);margin:0}
.gal img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(var(--z,1));transform-origin:var(--o,50% 50%);transition:transform 1.2s var(--ease)}
.gal figure:hover img{transform:scale(calc(var(--z,1)*1.07))}
.gal figcaption{position:absolute;left:12px;bottom:12px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(8px);padding:4px 12px;border-radius:99px;font-size:13px;font-weight:500}
@media (max-width:820px){.gal{grid-template-columns:1fr}}
a.btn{display:inline-block;white-space:nowrap}
a#auth.in{display:inline-flex;align-items:center;padding:6px 16px 6px 7px}
.av{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--stone);color:var(--bg);font-size:11px;font-weight:700;margin-right:8px}
.signin{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;padding:8px 0}
.authcard{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:36px;max-width:460px;width:100%;justify-self:end}
.authcard.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.fl{display:block;font-weight:600;font-size:14px;margin:18px 0 6px}
.fi{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;transition:border-color .3s,box-shadow .3s}
.fi:focus{outline:0;border-color:var(--stone);box-shadow:0 0 0 3px var(--stone-soft)}
.pwrap{position:relative}.pwrap .fi{padding-right:48px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:50%}
.eye svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.err{color:var(--stone);font-size:14px;min-height:22px;margin-top:10px;font-weight:500}
.btn.wide{width:100%;padding:13px}.btn:disabled{opacity:.55;cursor:default;transform:none}
.demo{display:flex;flex-direction:column;gap:6px;align-items:flex-start;margin-top:22px;padding:14px 16px;background:var(--bg);border-radius:14px;font-size:14px;color:var(--muted)}
.demo b{color:var(--ink)}code{font:600 13px var(--body);background:var(--stone-soft);color:var(--stone);padding:1px 7px;border-radius:6px}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0 28px}
.stats4 .stat{animation:pop .5s var(--ease) both;animation-delay:calc(var(--i,0)*60ms)}
.dash{display:grid;grid-template-columns:1.7fr 1fr;gap:24px;align-items:start}
.col{display:flex;flex-direction:column;gap:28px;min-width:0}
.col h3,.panel h3.ph{font:700 19px var(--display);letter-spacing:-.01em;margin-bottom:12px}
.tr.up{grid-template-columns:1fr auto auto}.tr.up>*{grid-column:auto}
.tr small{color:var(--muted);display:block}
.mini{border:1px solid var(--line);background:none;color:var(--ink);font:500 13px var(--body);padding:6px 12px;border-radius:99px;cursor:pointer;transition:background .25s,color .25s,border-color .25s}
.mini:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;width:var(--w);border-radius:99px;background:var(--stone);transform-origin:left;animation:grow 1.1s var(--ease) .2s both}
.meter.g i{background:var(--leaf)}
@keyframes grow{from{transform:scaleX(0)}}
.cr{margin-bottom:14px}.cr:last-child{margin-bottom:0}.cr div{display:flex;justify-content:space-between;font-size:14px;font-weight:500}
.cr span{color:var(--muted)}
.chk{display:flex;gap:10px;align-items:center;font-size:14px;margin-bottom:10px}
.chk svg{width:20px;height:20px;flex:none;fill:none;stroke:var(--leaf);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chk svg *{stroke-dasharray:30;stroke-dashoffset:30;animation:draw 1s var(--ease) .4s forwards}
.chk.todo svg{stroke:var(--muted)}
.tl{list-style:none;padding:0;border-left:2px solid var(--line);margin-left:6px}
.tl li{position:relative;padding:0 0 16px 18px;font-size:14px}
.tl li:before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--stone)}
.tl small{color:var(--muted);display:block}
.pl{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.pl li{display:flex;justify-content:space-between;gap:8px}.pl span{color:var(--muted);white-space:nowrap}
.studio{display:grid;grid-template-columns:5fr 6fr;gap:16px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;min-width:0}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:26px 16px;border:1.5px dashed var(--line);border-radius:18px;cursor:pointer;transition:border-color .3s,background .3s,transform .4s var(--ease)}
.drop:hover,.drop.over{border-color:var(--stone);background:var(--stone-soft);transform:scale(1.01)}
.drop svg{width:34px;height:34px;stroke:var(--stone);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;animation:float 2.6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.drop small,.hint{color:var(--muted);font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
textarea.fi{resize:vertical;min-height:200px;line-height:1.5}
.tools{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.msg{min-height:22px;font-size:14px;color:var(--stone);font-weight:500;margin:10px 0 0}
.opts{display:flex;gap:10px;margin:14px 0 0;align-items:center;flex-wrap:wrap;font-size:14px}
.opts select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.gorow{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
#st-out{margin-top:18px;min-height:220px}
.empty2{display:grid;place-items:center;text-align:center;gap:6px;padding:48px 16px;color:var(--muted);border:1px dashed var(--line);border-radius:18px}
.load{padding:28px 6px}.load p{color:var(--muted);margin-top:12px}
.load span{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--stone);margin-right:6px;animation:dot 1s ease-in-out infinite}
.load span:nth-child(2){animation-delay:.15s}.load span:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{transform:translateY(-8px);opacity:.4}}
.res{animation:pop .5s var(--ease) both}
.otitle{font:700 22px/1.2 var(--display);margin-bottom:8px}.sum{color:var(--muted);margin-bottom:16px}
.nsec{padding:14px 0;border-top:1px solid var(--line)}.nsec h4{font:600 16px var(--body);margin-bottom:6px}
.nsec ul,.res ul.b{padding-left:20px;display:flex;flex-direction:column;gap:5px;font-size:15px}
.terms{display:grid;gap:8px;margin-top:6px;font-size:14px}.terms b{color:var(--stone)}
.oact{margin-top:18px;display:flex;gap:8px;flex-wrap:wrap}
.idea{padding:14px 16px;border:1px solid var(--line);border-radius:16px;margin-bottom:10px;background:var(--bg)}
.idea b{display:block;font-size:16px}.idea p{font-size:14.5px;margin:4px 0}
.tip{font-size:13.5px;color:var(--leaf);font-weight:500}
.slide{min-height:clamp(240px,38vw,330px);background:var(--ink);color:var(--bg);border-radius:20px;padding:clamp(20px,5%,40px);display:flex;flex-direction:column;justify-content:center;gap:12px;animation:slin .55s var(--ease) both}
.slide.l{animation-name:slinl}
@keyframes slin{from{opacity:0;transform:translateX(36px)}}
@keyframes slinl{from{opacity:0;transform:translateX(-36px)}}
.slide small{opacity:.6}.slide h3{font:700 clamp(20px,3.4vw,34px)/1.1 var(--display);letter-spacing:-.02em;margin:0}
.slide.first h3{font-size:clamp(26px,4.6vw,46px)}
.slide ul{padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:clamp(14px,1.8vw,18px)}
.slide:before{content:"";width:44px;height:4px;border-radius:4px;background:var(--stone)}
.dctl{display:flex;justify-content:space-between;align-items:center;margin:12px 0;gap:8px}
.dots{display:flex;gap:6px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line);transition:all .4s var(--ease)}
.dots i.on{background:var(--stone);width:22px;border-radius:99px}
.snotes{font-size:14px;color:var(--muted);padding:12px 14px;background:var(--bg);border-radius:14px}.snotes b{color:var(--ink)}
.qh{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:6px}
.qq{font:600 18px/1.35 var(--body);margin:16px 0 14px}
.opt{display:flex;gap:12px;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:border-color .25s,background .25s,transform .3s var(--ease)}
.opt:hover:not(:disabled){transform:translateX(4px)}
.opt b{color:var(--muted)}
.opt.sel{border-color:var(--ink)}.opt.ok{border-color:var(--leaf);background:var(--leaf-soft)}.opt.bad{border-color:var(--stone);background:var(--stone-soft)}
.expl{font-size:14px;padding:12px 14px;border-radius:14px;background:var(--bg);margin:6px 0 12px;animation:pop .4s var(--ease) both}
.score{font:700 56px/1 var(--display);letter-spacing:-.04em;margin:8px 0}
@media (max-width:820px){.signin,.studio,.dash{grid-template-columns:1fr}.authcard{justify-self:stretch;max-width:none}.signin .arch{display:none}.stats4{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}
.gate{background:var(--ink);color:var(--bg);display:flex;justify-content:center;align-items:center;gap:14px;padding:8px 16px;font-size:14px;flex-wrap:wrap;text-align:center}
.gate[hidden]{display:none}
.gate .btn{background:var(--bg);color:var(--ink);padding:5px 14px;font-size:13px}
.acts{display:flex;gap:10px;align-items:center;flex:none}
a#auth{display:inline-flex;align-items:center;gap:8px}
.bi{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lk{width:12px;height:12px;margin-left:6px;vertical-align:-1px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.7}
@media (max-width:820px){.bar{flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 10px}.brand{margin-right:auto}.acts{order:2}nav{order:3;width:100%}}
.pform{display:none;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;margin-bottom:24px}
.pform.open{display:block;animation:pop .45s var(--ease) both}
.pform h3.ph{font:700 19px var(--display);margin-bottom:6px}
.jl{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.jc{gap:8px}.jtop{display:flex;gap:6px;flex-wrap:wrap}.jd{font-size:14.5px}
.lprev{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--bg);transition:border-color .3s,transform .3s var(--ease);min-width:0}
.lprev:hover{border-color:var(--stone);transform:translateY(-2px)}
.lprev>span:nth-child(2){flex:1;min-width:0;display:flex;flex-direction:column}
.lprev b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lprev small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fav{width:36px;height:36px;border-radius:10px;background:var(--stone-soft);color:var(--stone);display:grid;place-items:center;font:700 16px var(--display);flex:none}
.lprev svg{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.cprev{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;padding:0;cursor:zoom-in;background:var(--bg);height:150px;display:block;width:100%}
.cprev img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;transition:transform .8s var(--ease)}
.cprev:hover img{transform:scale(1.04)}
.cprev span{position:absolute;left:10px;bottom:10px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(6px);padding:3px 12px;border-radius:99px;font:500 13px var(--body);color:var(--ink)}
.jfoot{display:flex;justify-content:space-between;align-items:end;gap:8px;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.jbtn{display:flex;gap:6px}

.lb{position:fixed;inset:0;z-index:20;background:rgba(10,20,22,.78);display:grid;place-items:center;padding:24px;animation:fade .3s both;cursor:zoom-out}

.fprev{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:14px;flex-wrap:wrap}
.fprev:empty{display:none}.fprev img{height:56px;border-radius:8px;border:1px solid var(--line)}

@media (prefers-reduced-motion:reduce){*,::view-transition-old(page),::view-transition-new(page){animation-duration:.01ms!important;transition-duration:.01ms!important}}

var SAMPLE="A stack is a linear data structure that follows last in, first out order: the most recently added item is the first one removed. The two core operations are push, which adds an item to the top, and pop, which removes the top item. Peek reads the top item without removing it. Stacks are used for function call management, undo features, and checking balanced brackets in expressions. A queue follows first in, first out order: the item that has waited longest is served first. Enqueue adds an item at the rear and dequeue removes an item from the front. Queues are used in task scheduling, printer jobs, and breadth first search. Both structures can be built with arrays or linked lists. An array version is simple but can overflow when full, while a linked list version grows as needed. A circular queue reuses freed space at the front of an array so the queue does not appear full when there is still room. All the basic operations on a stack or queue take constant time, written O(1). A deque, or double ended queue, allows insertion and removal at both ends.";
